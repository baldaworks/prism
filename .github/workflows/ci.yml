name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install bd
        run: curl -fsSL https://raw.githubusercontent.com/gastownhall/beads/main/scripts/install.sh | bash

      - name: Verify bd
        run: bd version

      - name: Validate plugin packaging
        run: ./scripts/validate-plugin-packaging.sh

      - name: Validate lifecycle ownership
        run: ./scripts/validate-lifecycle-ownership.sh

      - name: Validate documentation
        run: ./scripts/validate-documentation.sh

      - name: Test lifecycle drift detection
        run: ./scripts/test-lifecycle-drift-detection.sh

      - name: Test documentation drift detection
        run: ./scripts/test-documentation-drift-detection.sh

      - name: Test lifecycle forward contracts
        run: ./scripts/test-lifecycle-forward-contracts.sh
